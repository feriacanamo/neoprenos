<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#081710; }
  html,body { width:1080px; height:1350px; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(120% 80% at 50% 0%, #163a24 0%, #0e2a1a 42%, #081710 100%);
    color:#f4eccf;
    position:relative;
    overflow:hidden;
  }
  /* marco dorado */
  .frame {
    position:absolute; inset:34px;
    border:2px solid rgba(217,180,74,0.55);
    border-radius:28px;
  }
  .frame::after {
    content:""; position:absolute; inset:10px;
    border:1px solid rgba(217,180,74,0.22);
    border-radius:20px;
  }
  .wrap {
    position:relative; z-index:2;
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:80px 90px 78px;
    text-align:center;
  }
  .logo { width:264px; height:264px; border-radius:50%;
    box-shadow:0 0 0 6px rgba(217,180,74,0.18), 0 24px 60px rgba(0,0,0,0.45); }
  .kicker {
    font-family:'Trebuchet MS', Arial, sans-serif;
    letter-spacing:7px; font-size:21px; font-weight:bold;
    color:#d9b44a; text-transform:uppercase; margin-top:36px;
  }
  h1 { font-size:76px; line-height:0.98; font-weight:bold; color:#f7f0d8;
       margin-top:16px; letter-spacing:1px; text-shadow:0 3px 18px rgba(0,0,0,.35); }
  h1 .year { color:#d9b44a; display:block; font-size:64px; margin-top:6px; letter-spacing:8px; }
  .rule { width:110px; height:3px; background:#d9b44a; margin:26px 0 24px; border-radius:2px; }
  .date {
    font-family:'Trebuchet MS', Arial, sans-serif;
    display:inline-block; border:2px solid #d9b44a; border-radius:60px;
    padding:14px 38px; font-size:29px; letter-spacing:4px; color:#f4eccf; font-weight:bold;
  }
  .venue { font-family:'Trebuchet MS', Arial, sans-serif;
    font-size:26px; color:#cddcc4; margin-top:24px; line-height:1.4; }
  .cats { font-family:'Trebuchet MS', Arial, sans-serif;
    font-size:26px; color:#e9dfb6; margin-top:22px; letter-spacing:2px; }
  .cats b { color:#d9b44a; font-weight:normal; }
  .price {
    font-family:'Trebuchet MS', Arial, sans-serif;
    margin-top:30px; background:rgba(10,31,19,0.75); border:1px solid #d9b44a;
    border-radius:18px; padding:20px 44px; font-size:33px; color:#f4eccf; font-weight:bold;
  }
  .price span { color:#d9b44a; }
  .web { font-family:'Trebuchet MS', Arial, sans-serif;
    margin-top:34px; font-size:29px; color:#d9b44a; letter-spacing:3px; font-weight:bold; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <img class="logo" src="icon.png" alt="logo">
    <div class="kicker">Primera edición · Fuerteventura</div>
    <h1>CANNARIAS<br>MASTERS CUP<span class="year">2026</span></h1>
    <div class="rule"></div>
    <div class="date">28 · NOVIEMBRE · 2026</div>
    <div class="venue">Villa privada en Fuerteventura<br>Competición · Premios · Fiesta</div>
    <div class="cats"><b>Sativa</b> &nbsp;·&nbsp; <b>Índica</b> &nbsp;·&nbsp; <b>Extracciones</b></div>
    <div class="price">Muestras desde <span>45€</span></div>
    <div class="web">www.cannariasmasterscup.com</div>
  </div>
</body>
</html>
